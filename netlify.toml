[build]
  command = "npm run build"
  publish = "dist"

# Esto hace que todas las rutas (como /planes o /veterinario/12) funcionen bien
# en Netlify, ya que la app maneja la navegación internamente (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker nunca se guarda en caché, así los cambios llegan enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
